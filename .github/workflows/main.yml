name: Alpha AI Anime Generator
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Describe the anime scene'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libasound2 වෙනුවට libasound2t64 හෝ libasound2* ලෙස භාවිත කිරීමෙන් Error එක නැති වේ
          sudo apt-get install -y ffmpeg xvfb libasound2t64 || sudo apt-get install -y ffmpeg xvfb libasound2
          pip install ursina requests
          
      - name: AI Code Generation & Rendering
        env:
          GITHUB_TOKEN: ${{ secrets.ALPHA_AI_TOKEN }} 
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: |
          python generator.py
          xvfb-run -s "-screen 0 1280x720x24" python renderer.py
          
      - name: Upload Anime Video
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-AI-Video
          path: output.mp4
