name: Alpha AI Anime Generator
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Anime Scene Prompt'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libasound2
          pip install ursina requests
      - name: Generate & Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: |
          python generator.py
          xvfb-run -s "-screen 0 1280x720x24" python renderer.py
      - name: Upload Video
        uses: actions/upload-artifact@v3
        with:
          name: anime-video
          path: output.mp4
