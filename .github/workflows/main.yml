name: Alpha AI Anime Generator
on:
  workflow_dispatch:
    inputs:
      user_prompt:
        description: 'Describe the anime scene'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libasound2
          pip install ursina requests
          
      - name: AI Code Generation & Rendering
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: |
          # මුලින්ම GPT-4 එකෙන් කෝඩ් එක හදාගන්නවා
          python generator.py
          # ඊළඟට ඒ කෝඩ් එක Ursina වලින් රන් කරලා වීඩියෝව හදනවා
          xvfb-run -s "-screen 0 1280x720x24" python renderer.py
          
      - name: Upload Anime Video
        uses: actions/upload-artifact@v3
        with:
          name: Alpha-AI-Video
          path: output.mp4
